name: agent-landing-zone
metadata:
  template: agent-app-ingestion
infra:
  provider: bicep
  path: infra
  module: main
hooks:
  predeploy:
    posix:
      run: scripts/deploy.sh
      interactive: true
    windows:
      run: scripts/deploy.ps1
      interactive: true  
  preprovision:
    posix:
      run: scripts/preProvision.sh
      interactive: true
    windows:
      run: scripts/preProvision.ps1
      interactive: true